# Opt-in Windows development profile. The normal MySQL profile is unchanged.
spring:
  datasource:
    url: "jdbc:h2:file:./data/runtime/local-db/yisheng;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_ON_EXIT=FALSE"
    username: sa
    password: ${LOCAL_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/local-native.sql
  data:
    redis:
      host: 127.0.0.1
      port: ${LOCAL_REDIS_PORT:6380}
      password: ${LOCAL_REDIS_PASSWORD:}
      connect-timeout: 3s
      timeout: 3s
app:
  deepseek:
    model: ${DEEPSEEK_MODEL:deepseek-flash}
  rag:
    vector:
      enabled: false
      warmup-enabled: false
    embedding:
      enabled: false
  screening:
    async:
      enabled: false
management:
  health:
    rabbit:
      enabled: false
