<script>
(() => {
  const root = document.getElementById('xiaoyi-liquid-nav');
  if (!root) return;
  const stage = root.querySelector('.lg-stage');
  const dock = root.querySelector('.lg-dock');
  const items = root.querySelector('.lg-items');
  const lens = root.querySelector('.lg-lens');
  const outline = root.querySelector('.lg-fluid-outline');
  const contour = root.querySelector('.lg-fluid-contour');
  const overlay = root.querySelector('.lg-active');
  const gleam = root.querySelector('.lg-gleam');
  const buttons = [...root.querySelectorAll('.lg-tab')];
  const cells = [...root.querySelectorAll('.lg-cell')];
  const title = root.querySelector('.lg-title');
  const section = root.querySelector('.lg-section-label');
  const description = root.querySelector('.lg-description');
  const ambient = ['mint', 'peach', 'blue'].map(name => root.querySelector('.lg-ambient-' + name));
  const pages = [
    { label: '陪伴', title: '今天想聊些什么？', description: '我在这里，陪你聊聊。' },
    { label: '观察', title: '从一张图片开始', description: '慢慢说，不着急。' },
    { label: '记录', title: '每一次，都记得', description: '记录点滴，关注变化。' },
    { label: '我的', title: '把陪伴调成喜欢的样子', description: '你的偏好，都在这里。' }
  ];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const options = { opacity: .32, blur: 24, response: 240, reducedMotion: false };
  const clamp = (n, low, high) => Math.min(high, Math.max(low, n));
  const reducedMotion = () => reduced.matches || options.reducedMotion;
  let selected = 0, slot = 1, width = 1;
  let x = 0, velocity = 0, target = 0, tail = 0, tailVelocity = 0;
  let pressure = 0, pressureVelocity = 0, pressureTarget = 0;
  let gesture = null, raf = 0, previousTime = 0, ignoreClickUntil = 0;

  // One continuous, closed organic contour. The head follows the pointer;
  // the smaller trailing lobe catches up through its own damped spring.
  function makeContour() {
    const rx = Math.max(12, (slot - 4) / 2), ry = 32.5;
    const gap = reducedMotion() ? 0 : Math.abs(x - tail);
    const amount = clamp(gap / (slot * 1.25), 0, 1);
    const speed = reducedMotion() ? 0 : clamp(Math.abs(velocity) / 1500, 0, 1);
    const headRX = Math.min(slot / 2 - .7, rx * (1 + pressure * .025 + speed * .04));
    const headRY = ry * (1 - pressure * .055 - speed * .025);
    const tailRX = rx * (1 - .42 * amount);
    const tailRY = ry * (1 - .43 * amount);
    const headCX = clamp(x + slot / 2, headRX + .5, width - headRX - .5);
    const tailCX = reducedMotion() ? headCX : clamp(tail + slot / 2, tailRX + .5, width - tailRX - .5);
    const distance = Math.abs(headCX - tailCX);
    const leftLobe = headCX <= tailCX ? { cx: headCX, rx: headRX, ry: headRY } : { cx: tailCX, rx: tailRX, ry: tailRY };
    const rightLobe = headCX <= tailCX ? { cx: tailCX, rx: tailRX, ry: tailRY } : { cx: headCX, rx: headRX, ry: headRY };
    const start = Math.min(headCX - headRX, tailCX - tailRX);
    const end = Math.max(headCX + headRX, tailCX + tailRX);
    const steps = Math.max(24, Math.min(48, Math.ceil((end - start) / 4.5)));
    const top = [], bottom = [];
    const envelope = (p, lobe) => {
      const u = Math.abs((p - lobe.cx) / lobe.rx);
      return u >= 1 ? 0 : lobe.ry * Math.pow(1 - Math.pow(u, 3.15), 1 / 3.15);
    };
    const smoothMax = (a, b, k) => Math.max(a, b) + Math.pow(Math.max(k - Math.abs(a - b), 0), 2) / (4 * k);
    for (let i = 0; i <= steps; i++) {
      const px = start + (end - start) * i / steps;
      let half, centerY = 34;
      if (distance < 1) {
        half = envelope(px, { cx: headCX, rx: headRX, ry: headRY });
      } else {
        half = Math.max(envelope(px, leftLobe), envelope(px, rightLobe));
        if (px > leftLobe.cx && px < rightLobe.cx) {
          const t = (px - leftLobe.cx) / distance;
          const base = leftLobe.ry + (rightLobe.ry - leftLobe.ry) * t;
          const pinch = clamp(distance / (leftLobe.rx + rightLobe.rx) * .88, 0, .88);
          const bridge = Math.max(3.8, base * (1 - pinch * Math.pow(Math.sin(Math.PI * t), .65)));
          half = smoothMax(half, bridge, 2.2);
          centerY += Math.sin(Math.PI * t) * amount * Math.sign(velocity) * 1.5;
        }
      }
      if (i === 0 || i === steps) half = 0;
      half = Math.min(half, 32.8);
      top.push([px, centerY - half]); bottom.push([px, centerY + half]);
    }
    const points = top.concat(bottom.reverse().slice(1, -1));
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const number = n => Math.round(n * 100) / 100;
    const first = mid(points[points.length - 1], points[0]);
    let d = `M${number(first[0])} ${number(first[1])}`;
    for (let i = 0; i < points.length; i++) {
      const p = points[i], next = mid(p, points[(i + 1) % points.length]);
      d += `Q${number(p[0])} ${number(p[1])} ${number(next[0])} ${number(next[1])}`;
    }
    return { d: d + 'Z', gap, left: start, right: end };
  }

  function draw() {
    const shape = makeContour();
    const clip = `path("${shape.d}")`;
    overlay.style.clipPath = clip;
    contour.setAttribute('d', shape.d);
    lens.dataset.gap = shape.gap.toFixed(2);
    lens.dataset.head = x.toFixed(2);
    lens.dataset.tail = tail.toFixed(2);
  }

  function tick(time) {
    const dt = Math.min((time - (previousTime || time - 16)) / 1000, .16);
    previousTime = time;
    const steps = Math.max(1, Math.ceil(dt / .008)), h = dt / steps;
    const k = 800 * Math.pow(240 / options.response, 2);
    for (let i = 0; i < steps; i++) {
      if (!gesture || !gesture.dragging) {
        velocity += ((target - x) * k - 2 * Math.sqrt(k) * velocity) * h;
        x += velocity * h;
      } else if (time - gesture.lastTime > 45) velocity *= Math.exp(-h * 18);
      tailVelocity += ((x - tail) * 200 - 28.3 * tailVelocity) * h;
      tail += tailVelocity * h;
      pressureVelocity += ((pressureTarget - pressure) * 1000 - 64 * pressureVelocity) * h;
      pressure += pressureVelocity * h;
    }
    draw();
    const headMoving = (!gesture || !gesture.dragging) && (Math.abs(target - x) > .04 || Math.abs(velocity) > .4);
    const tailMoving = Math.abs(x - tail) > .09 || Math.abs(tailVelocity) > .5;
    const pressMoving = Math.abs(pressureTarget - pressure) > .002 || Math.abs(pressureVelocity) > .01;
    const dragMoving = gesture && gesture.dragging && Math.abs(velocity) > .5;
    if (headMoving || tailMoving || pressMoving || dragMoving) raf = requestAnimationFrame(tick);
    else {
      if (!gesture || !gesture.dragging) x = target;
      tail = x; velocity = tailVelocity = 0; pressure = pressureTarget;
      draw(); raf = 0; previousTime = 0;
    }
  }

  function animate() {
    if (reducedMotion()) {
      if (!gesture || !gesture.dragging) x = target;
      tail = x; velocity = tailVelocity = 0; pressure = pressureTarget; draw(); return;
    }
    if (!raf) { previousTime = 0; raf = requestAnimationFrame(tick); }
  }

  function geometry() {
    width = items.getBoundingClientRect().width; slot = width / 4;
    outline.setAttribute('viewBox', `0 0 ${width} 68`);
    x = target = tail = selected * slot; velocity = tailVelocity = 0; draw();
  }

  function content(instant = false) {
    const page = pages[selected];
    section.textContent = page.label; title.textContent = page.title; description.textContent = page.description;
    buttons.forEach((b, i) => b.setAttribute('aria-selected', String(i === selected)));
    ambient.forEach(el => el.style.transition = instant || reducedMotion() ? 'none' : '');
    ambient[0].style.transform = `translate(${selected * 47}px,${-selected * 18}px)`;
    ambient[1].style.transform = `translate(${-selected * 26}px,${selected % 2 ? 68 : 0}px)`;
    ambient[2].style.transform = `translate(${-selected * 34}px,${-selected * 29}px)`;
  }

  function select(index, animated = true) {
    if (index < 0 || index > 3) return;
    selected = index; target = index * slot; content(!animated);
    if (animated && !reducedMotion()) animate();
    else {
      if (raf) cancelAnimationFrame(raf); raf = 0;
      x = tail = target; velocity = tailVelocity = 0; pressure = pressureTarget; draw();
    }
  }

  function point(event) {
    const rect = dock.getBoundingClientRect();
    gleam.style.transform = `translate3d(${clamp(event.clientX - rect.left, 0, rect.width) - 60}px,0,0)`;
  }
  function pressed(index, on) {
    buttons.forEach((b, i) => b.dataset.pressed = String(on && i === index));
    cells.forEach((c, i) => c.dataset.pressed = String(on && i === index));
    pressureTarget = on ? 1 : 0; gleam.style.opacity = on ? '.85' : '0'; animate();
  }

  dock.addEventListener('pointerdown', event => {
    const button = event.target.closest('.lg-tab');
    if (!button || gesture || !event.isPrimary || event.button !== 0) return;
    const index = buttons.indexOf(button);
    gesture = { id: event.pointerId, index, startX: event.clientX, lastX: event.clientX, lastTime: performance.now(), anchor: x, dragging: false, v: 0 };
    dock.setPointerCapture(event.pointerId); point(event); target = index * slot; pressed(index, true);
  });
  dock.addEventListener('pointermove', event => {
    if (!gesture) { if (event.pointerType === 'mouse') point(event); return; }
    if (event.pointerId !== gesture.id) return;
    const dx = event.clientX - gesture.startX, now = performance.now();
    if (!gesture.dragging && Math.abs(dx) > 6) { gesture.dragging = true; gesture.anchor = x - dx; }
    if (gesture.dragging) {
      const raw = gesture.anchor + dx, max = slot * 3;
      x = raw < 0 ? -24 * (1 - Math.exp(raw / 70)) : raw > max ? max + 24 * (1 - Math.exp(-(raw - max) / 70)) : raw;
      gesture.v = clamp((event.clientX - gesture.lastX) / Math.max((now - gesture.lastTime) / 1000, .008), -1600, 1600);
      velocity = gesture.v; point(event); draw(); animate();
    }
    gesture.lastX = event.clientX; gesture.lastTime = now;
  });

  function release(event, cancel = false) {
    if (!gesture || event.pointerId !== gesture.id) return;
    const finished = gesture; gesture = null;
    if (dock.hasPointerCapture(event.pointerId)) dock.releasePointerCapture(event.pointerId);
    velocity = finished.v * Math.exp(-(performance.now() - finished.lastTime) / 90);
    pressed(finished.index, false); ignoreClickUntil = performance.now() + 400;
    const rect = items.getBoundingClientRect();
    if (cancel || event.clientY < rect.top - 32 || event.clientY > rect.bottom + 32) {
      target = selected * slot; animate(); return;
    }
    const projected = event.clientX - rect.left + (finished.dragging ? velocity * .025 : 0);
    select(finished.dragging ? clamp(Math.floor(projected / slot), 0, 3) : finished.index, true);
  }
  dock.addEventListener('pointerup', event => release(event));
  dock.addEventListener('pointercancel', event => release(event, true));
  dock.addEventListener('lostpointercapture', event => { if (gesture) release(event, true); });
  dock.addEventListener('pointerleave', () => { if (!gesture) gleam.style.opacity = '0'; });
  dock.addEventListener('click', event => {
    const button = event.target.closest('.lg-tab'); if (!button) return;
    if (event.detail === 0) select(buttons.indexOf(button), false);
    else if (performance.now() > ignoreClickUntil) select(buttons.indexOf(button), true);
  });
  dock.addEventListener('keydown', event => {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
    event.preventDefault();
    const next = event.key === 'Home' ? 0 : event.key === 'End' ? 3 : clamp(selected + (event.key === 'ArrowRight' ? 1 : -1), 0, 3);
    select(next, false); buttons[next].focus();
  });
  geometry(); content(true); new ResizeObserver(geometry).observe(items);
  reduced.addEventListener('change', () => select(selected, false));
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) return;
    if (gesture && dock.hasPointerCapture(gesture.id)) dock.releasePointerCapture(gesture.id);
    gesture = null; pressureTarget = 0;
    buttons.forEach(b => b.dataset.pressed = 'false'); cells.forEach(c => c.dataset.pressed = 'false');
    gleam.style.opacity = '0'; select(selected, false);
  });
})();

</script>
